name: Test and Release Check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Check version consistency
        run: python -c "from pathlib import Path; import re; v=Path('VERSION').read_text().strip(); g=Path('mntrapteam/gui.py').read_text(); assert re.fullmatch(r'\d+\.\d+\.\d+',v); assert f'MNTrapTeam {v}' in g"
